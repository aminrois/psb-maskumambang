<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Lupa Kata Sandi - PSB Pondok Pesantren Maskumambang</title>
  <link rel="icon" type="image/webp" id="app-favicon" href="/static/img/favicon_87007b6344.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 16px;
      background: var(--bg-body);
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 36px 30px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-md);
    }
  </style>
</head>
<body class="public-layout">

  <div class="auth-page-wrapper">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="/" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none;">
        <img id="nav-logo" src="/static/img/logo_e7a8b6a95d.webp" alt="Logo" style="height: 44px; width: auto; border-radius: 8px;" onerror="this.style.display='none'">
        <h2 id="auth-app-title" style="font-size: 1.4rem; color: var(--text-heading); font-weight: 800; margin: 0;">PSB Maskumambang</h2>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;">Portal Resmi Penerimaan Santri Baru (PSB)</p>
    </div>

    <div class="auth-card">
      <div style="margin-bottom: 20px;">
        <div style="width: 48px; height: 48px; border-radius: 12px; background: rgba(15, 118, 110, 0.12); color: var(--primary-600); display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin-bottom: 14px;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h3 style="font-size: 1.3rem; margin-bottom: 6px; color: var(--text-heading); font-weight: 800;">Lupa Kata Sandi?</h3>
        <p style="color: var(--text-muted); font-size: 0.875rem; line-height: 1.5; margin: 0;">
          Masukkan alamat email yang terdaftar. Kami akan mengirimkan tautan reset kata sandi ke email Anda melalui <strong>info@maskumambang.ac.id</strong>.
        </p>
      </div>

      <div id="forgot-alert" style="display: none; padding: 14px; border-radius: 10px; margin-bottom: 20px; font-size: 0.875rem; line-height: 1.5;"></div>

      <form id="forgot-form" onsubmit="handleForgotSubmit(event)">
        <div class="form-group" style="margin-bottom: 22px;">
          <label class="form-label" style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Alamat Email Terdaftar</label>
          <div style="position: relative;">
            <input type="email" id="forgot-email" class="form-control" placeholder="nama@email.com" required autocomplete="email" style="width: 100%; padding: 11px 14px 11px 38px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); border-radius: var(--radius-md);">
            <i class="fa-solid fa-envelope" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem;"></i>
          </div>
        </div>

        <button type="submit" id="forgot-submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 700;">
          <i class="fa-solid fa-paper-plane"></i> Kirim Link Reset Kata Sandi
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
        Sudah ingat kata sandi Anda? <a href="/login.html" style="color: var(--primary-600); font-weight: 700; text-decoration: none;">Masuk di Sini</a>
      </div>
      <div style="text-align: center; margin-top: 12px; font-size: 0.85rem;">
        <a href="/" style="color: var(--text-dim); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Kembali ke Beranda</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js?v=20260905_cardphoto_v4"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadBrandingInfo();
    });

    async function handleForgotSubmit(e) {
      if (e) e.preventDefault();
      const btn = document.getElementById('forgot-submit-btn');
      const emailInput = document.getElementById('forgot-email');
      const email = emailInput ? emailInput.value.trim() : '';

      if (!email) {
        showBannerAlert('forgot-alert', 'Silakan masukkan alamat email Anda.', 'danger');
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim Tautan...';
      }

      try {
        const res = await apiRequest('/api/auth/forgot-password', 'POST', { email });

        if (res && res.success) {
          showBannerAlert(
            'forgot-alert',
            `<strong>Tautan Terkirim!</strong><br>${res.message || 'Silakan periksa kotak masuk atau folder spam email Anda untuk mereset kata sandi.'}`,
            'success'
          );
          if (emailInput) emailInput.value = '';
        } else {
          showBannerAlert('forgot-alert', res.message || 'Gagal memproses permintaan reset kata sandi.', 'danger');
        }
      } catch (err) {
        showBannerAlert('forgot-alert', err.message || 'Terjadi kesalahan saat memproses permintaan.', 'danger');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Ulang Link Reset';
        }
      }
    }
    window.handleForgotSubmit = handleForgotSubmit;
  </script>
</body>
</html>
