<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <title>Daftar Akun Baru - PSB Maskumambang</title>
  <link rel="icon" type="image/webp" id="app-favicon" href="/static/img/favicon_87007b6344.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 36px;
    }

    .theme-toggle-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>

<body class="public-layout">

  <div class="auth-page-wrapper">
    <div style="text-align: center; margin-bottom: 24px;">
      <a href="/" style="display: inline-flex; align-items: center; gap: 10px; text-decoration: none;">
        <img id="nav-logo" src="/static/img/logo_e7a8b6a95d.webp" alt="Logo"
          style="height: 44px; width: auto; border-radius: 8px;" onerror="this.style.display='none'">
        <h2 id="auth-app-title" style="font-size: 1.4rem; color: var(--text-heading); font-weight: 800; margin: 0;">PSB
          Maskumambang</h2>
      </a>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;">Pendaftaran Akun Calon Santri Baru</p>
    </div>

    <div class="auth-card">
      <div style="margin-bottom: 24px;">
        <h3 style="font-size: 1.3rem; margin-bottom: 6px; color: var(--text-heading);">Buat Akun Baru</h3>
        <p style="color: var(--text-muted); font-size: 0.875rem;">Lengkapi data akun untuk mendaftar sebagai calon
          santri baru.</p>
      </div>

      <div id="register-alert"
        style="display: none; padding: 12px; border-radius: 8px; margin-bottom: 18px; font-size: 0.9rem;"></div>

      <form id="register-form" onsubmit="handleRegisterSubmit(event)">
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label"
            style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Nama
            Lengkap</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Nama Lengkap Pendaftar" required
            style="width: 100%; padding: 11px 14px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); border-radius: var(--radius-md);">
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label"
              style="font-size: 0.875rem; font-weight: 600; color: var(--text-main); margin: 0;">Username</label>
            <span id="username-feedback" style="font-size: 0.8rem; font-weight: 600; display: none;"></span>
          </div>
          <div style="position: relative;">
            <input type="text" id="reg-username" class="form-control" placeholder="Contoh: santri_fauzi26" required
              autocomplete="username" autocapitalize="none" spellcheck="false"
              style="width: 100%; padding: 11px 36px 11px 14px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); border-radius: var(--radius-md);">
            <span id="username-spinner" style="display: none; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 0.85rem; color: var(--text-muted);">
              <i class="fa-solid fa-spinner fa-spin"></i>
            </span>
          </div>
          <small style="display: block; margin-top: 4px; font-size: 0.75rem; color: var(--text-muted);">
            Digunakan untuk masuk/login akun (huruf kecil, angka, titik, underscore, min. 3 karakter).
          </small>
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label"
            style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Alamat
            Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="nama@email.com" required
            autocomplete="email"
            style="width: 100%; padding: 11px 14px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); border-radius: var(--radius-md);">
        </div>
        <div class="form-group" style="margin-bottom: 16px;">
          <label class="form-label"
            style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Kata
            Sandi (Minimal 6 Karakter)</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" required minlength="6"
            autocomplete="new-password"
            style="width: 100%; padding: 11px 14px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); border-radius: var(--radius-md);">
        </div>
        <div class="form-group" style="margin-bottom: 22px;">
          <label class="form-label"
            style="display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: var(--text-main);">Nomor
            WhatsApp Aktif</label>
          <input type="text" id="reg-phone" class="form-control" placeholder="Contoh: 081234567890" required
            style="width: 100%; padding: 11px 14px; border: 1px solid var(--input-border); background: var(--input-bg); color: var(--text-main); border-radius: var(--radius-md);">
        </div>

        <div id="recaptcha-wrapper" style="margin-bottom: 20px; display: flex; justify-content: center;">
          <div class="g-recaptcha" data-sitekey="6LfPxLAtAAAAAMaeu-yp0yoozI6IiQkshQaKJgAd"></div>
        </div>

        <button type="submit" id="register-submit-btn" class="btn btn-primary"
          style="width: 100%; padding: 12px; font-size: 0.95rem; font-weight: 700;">
          <i class="fa-solid fa-check"></i> Buat Akun Calon Santri
        </button>
      </form>

      <div
        style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle); font-size: 0.9rem; color: var(--text-muted);">
        Sudah memiliki akun? <a href="/login.html"
          style="color: var(--primary-600); font-weight: 700; text-decoration: none;">Masuk ke Akun</a>
      </div>
      <div style="text-align: center; margin-top: 10px; font-size: 0.85rem;">
        <a href="/" style="color: var(--text-dim); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i>
          Kembali ke Beranda</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js?v=20261010_rc"></script>
  <script>
    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    let usernameDebounceTimer = null;
    let isUsernameAvailable = false;
    let lastCheckedUsername = '';

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadBrandingInfo();
      setupUsernameChecker();

      if (isLocalhost) {
        const rc = document.getElementById('recaptcha-wrapper');
        if (rc) rc.style.display = 'none';
      }

      const form = document.getElementById('register-form');
      if (form) {
        form.addEventListener('submit', handleRegisterSubmit);
      }
    });

    function setupUsernameChecker() {
      const input = document.getElementById('reg-username');
      const feedback = document.getElementById('username-feedback');
      const spinner = document.getElementById('username-spinner');
      if (!input) return;

      input.addEventListener('input', () => {
        const val = input.value.trim().toLowerCase();
        clearTimeout(usernameDebounceTimer);

        if (!val) {
          feedback.style.display = 'none';
          spinner.style.display = 'none';
          input.style.borderColor = 'var(--input-border)';
          isUsernameAvailable = false;
          return;
        }

        if (val.length < 3) {
          feedback.style.display = 'inline-block';
          feedback.style.color = '#ef4444';
          feedback.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Min. 3 karakter';
          input.style.borderColor = '#ef4444';
          spinner.style.display = 'none';
          isUsernameAvailable = false;
          return;
        }

        if (!/^[a-zA-Z0-9._]+$/.test(val)) {
          feedback.style.display = 'inline-block';
          feedback.style.color = '#ef4444';
          feedback.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Karakter tidak valid';
          input.style.borderColor = '#ef4444';
          spinner.style.display = 'none';
          isUsernameAvailable = false;
          return;
        }

        spinner.style.display = 'inline-block';
        feedback.style.display = 'none';

        usernameDebounceTimer = setTimeout(async () => {
          await verifyUsername(val);
        }, 400);
      });

      input.addEventListener('blur', async () => {
        const val = input.value.trim().toLowerCase();
        if (val && val.length >= 3 && /^[a-zA-Z0-9._]+$/.test(val) && val !== lastCheckedUsername) {
          await verifyUsername(val);
        }
      });
    }

    async function verifyUsername(username) {
      const input = document.getElementById('reg-username');
      const feedback = document.getElementById('username-feedback');
      const spinner = document.getElementById('username-spinner');
      if (!input || !feedback) return;

      try {
        const res = await apiRequest(`/api/auth/check-username?username=${encodeURIComponent(username)}`, {
          method: 'GET',
        });
        lastCheckedUsername = username;
        if (spinner) spinner.style.display = 'none';
        feedback.style.display = 'inline-block';

        if (res.available) {
          isUsernameAvailable = true;
          feedback.style.color = '#10b981';
          feedback.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${res.message || 'Username tersedia'}`;
          input.style.borderColor = '#10b981';
        } else {
          isUsernameAvailable = false;
          feedback.style.color = '#ef4444';
          feedback.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${res.message || 'Sudah digunakan'}`;
          input.style.borderColor = '#ef4444';
        }
      } catch (err) {
        if (spinner) spinner.style.display = 'none';
        console.error('Gagal mengecek username:', err);
      }
    }

    async function handleRegisterSubmit(e) {
      if (e) e.preventDefault();

      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-username').value.trim().toLowerCase();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const password = document.getElementById('reg-password').value;
      const phoneNumber = document.getElementById('reg-phone').value.trim();

      if (!username || username.length < 3) {
        showBannerAlert('register-alert', 'Username minimal 3 karakter.', 'danger');
        document.getElementById('reg-username').focus();
        return;
      }

      if (!/^[a-zA-Z0-9._]+$/.test(username)) {
        showBannerAlert('register-alert', 'Username hanya boleh huruf, angka, titik (.), dan garis bawah (_).', 'danger');
        document.getElementById('reg-username').focus();
        return;
      }

      // Check if already checked and taken
      if (!isUsernameAvailable && lastCheckedUsername === username) {
        showBannerAlert('register-alert', 'Username sudah digunakan oleh pendaftar lain. Silakan pilih username lain.', 'danger');
        document.getElementById('reg-username').focus();
        return;
      }

      let captchaToken = '';
      const recaptchaWrapper = document.getElementById('recaptcha-wrapper');
      const isRecaptchaHidden = recaptchaWrapper && recaptchaWrapper.style.display === 'none';
      if (isLocalhost || isRecaptchaHidden) {
        captchaToken = 'LOCAL_BYPASS';
      } else {
        if (typeof grecaptcha !== 'undefined' && grecaptcha.getResponse) {
          try {
            captchaToken = grecaptcha.getResponse();
          } catch (err) {
            captchaToken = '';
          }
        }
        if (!captchaToken) {
          showBannerAlert('register-alert', 'Silakan centang verifikasi "Saya bukan robot" (reCAPTCHA) terlebih dahulu.', 'danger');
          return;
        }
      }

      const btn = document.getElementById('register-submit-btn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
      }

      try {
        const res = await apiRequest('/api/auth/register', {
          method: 'POST',
          body: { name, username, email, password, phoneNumber, captchaToken },
        });

        if (res.success && res.data) {
          const authData = res.data;
          const user = authData.user || authData;
          const token = authData.accessToken;

          if (token && user) {
            if (typeof saveSession === 'function') {
              saveSession(user, token);
            } else if (typeof setSession === 'function') {
              setSession(token, user);
            } else {
              localStorage.setItem('currentUser', JSON.stringify(user));
              localStorage.setItem('accessToken', token);
            }
            showBannerAlert('register-alert', 'Akun berhasil dibuat! Mengarahkan ke formulir pendaftaran awal...', 'success');
            setTimeout(() => {
              window.location.href = '/dashboard.html#daftar';
            }, 800);
            return;
          }

          showBannerAlert('register-alert', 'Akun berhasil dibuat! Mengalihkan ke halaman masuk...', 'success');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1000);
        } else {
          showBannerAlert('register-alert', res.message || 'Gagal membuat akun.', 'danger');
          if (typeof grecaptcha !== 'undefined' && grecaptcha.reset) grecaptcha.reset();
        }
      } catch (err) {
        showBannerAlert('register-alert', err.message || 'Gagal membuat akun.', 'danger');
        if (typeof grecaptcha !== 'undefined' && grecaptcha.reset) grecaptcha.reset();
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-check"></i> Buat Akun Calon Santri';
        }
      }
    }
    window.handleRegisterSubmit = handleRegisterSubmit;
  </script>
</body>

</html>
